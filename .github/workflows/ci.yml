name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # GitHub의 Windows 러너에는 Chrome이 미리 설치돼 있어 브라우저 스모크 테스트를 그대로 돌릴 수 있다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: dotnet build src -c Release

      - name: Self-test
        run: dotnet run --project src -c Release --no-build -- --self-test

      - name: Browser smoke test
        # 러너 환경에 따라 GUI 창이나 알림 영역이 불안정할 수 있어, 실패해도 빌드는 막지 않고 결과만 남긴다.
        continue-on-error: true
        run: node tests/browser-smoke.mjs

      - name: Package check
        shell: pwsh
        run: ./build/package.ps1 -OutputDirectory artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: tabbouncer-${{ github.sha }}
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          retention-days: 14
